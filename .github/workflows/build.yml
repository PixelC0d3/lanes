name: Build

# Runs the test suite and builds the plugin zip on every push and pull request,
# so a merge is never the first time the build is exercised on a clean machine.
on:
  push:
    branches: [mainline]
  pull_request:
  workflow_dispatch:

concurrency:
  # a new push to the same branch supersedes the run in flight
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The build targets the 2023.3 platform and compiles to Java 17 bytecode
      # (see build.gradle: sourceCompatibility/jvmTarget).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The IntelliJ platform dependency is a large download; caching it keeps
      # subsequent runs to a couple of minutes.
      - name: Cache IntelliJ Platform
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-3
            ~/.gradle/caches/transforms-4
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: intellij-platform-${{ runner.os }}-

      - name: Test
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Upload test report
        # the report is most useful exactly when the tests failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: lanes-plugin
          path: build/distributions/*.zip
          retention-days: 14
