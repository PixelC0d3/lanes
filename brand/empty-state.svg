<svg width="320" height="260" viewBox="0 0 320 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No applications are being monitored">
  <style>
    .frame  { stroke: #C9CCD6; }
    .ghost  { fill: #D6D9E0; }
    .ghost2 { fill: #E3E5EB; }
    .txt    { font-family: Inter, 'JetBrains Sans', -apple-system, 'Segoe UI', sans-serif; fill: #494B52; }
    .sub    { font-family: Inter, 'JetBrains Sans', -apple-system, 'Segoe UI', sans-serif; fill: #8C8F98; }
    @media (prefers-color-scheme: dark) {
      .frame  { stroke: #3B3E45; }
      .ghost  { fill: #3B3E45; }
      .ghost2 { fill: #2E3136; }
      .txt    { fill: #D3D5DB; }
      .sub    { fill: #85888F; }
    }
  </style>

  <!-- Dashed board -->
  <rect x="60" y="24" width="200" height="140" rx="16" fill="none" class="frame" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Ghost lanes (the mark, waiting to come alive) -->
  <rect x="88" y="56" width="90" height="14" rx="7" class="ghost"/>
  <circle cx="200" cy="63" r="7" class="ghost2"/>
  <rect x="88" y="86" width="132" height="14" rx="7" class="ghost"/>
  <rect x="88" y="116" width="64" height="14" rx="7" class="ghost2"/>
  <circle cx="174" cy="123" r="7" class="ghost"/>

  <!-- Add action -->
  <circle cx="248" cy="152" r="24" fill="#3574F0"/>
  <path d="M248 142v20M238 152h20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <text x="160" y="212" text-anchor="middle" class="txt" font-size="16" font-weight="600">No applications are being monitored</text>
  <text x="160" y="236" text-anchor="middle" class="sub" font-size="13">Add an application or discover running processes to get started</text>
</svg>
