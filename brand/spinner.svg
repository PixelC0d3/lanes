<svg width="48" height="48" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">
  <!-- Multiple Run spinner: the lanes come alive -->
  <rect x="2" y="2" height="3" rx="1.5" fill="#3574F0" width="8">
    <animate attributeName="width" values="4;11;4" dur="1.2s" repeatCount="indefinite" begin="0s"
             calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </rect>
  <rect x="2" y="6.5" height="3" rx="1.5" fill="#3574F0" width="12">
    <animate attributeName="width" values="5;12;5" dur="1.2s" repeatCount="indefinite" begin="0.15s"
             calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </rect>
  <rect x="2" y="11" height="3" rx="1.5" fill="#4FC3F7" width="6">
    <animate attributeName="width" values="3;9;3" dur="1.2s" repeatCount="indefinite" begin="0.3s"
             calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </rect>
  <circle cy="8" r="1.5" fill="#4FC3F7" cx="14">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="cx" values="8;14;8" dur="1.2s" repeatCount="indefinite" begin="0.15s"
             calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
</svg>
