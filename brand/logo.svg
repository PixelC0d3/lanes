<svg width="260" height="64" viewBox="0 0 260 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lanes">
  <style>
    .word { font-family: 'Inter', 'JetBrains Sans', -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; fill: #1E1F22; }
    .dotc { fill: #3574F0; }
    .sub  { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace; font-size: 10px; letter-spacing: 2.5px; fill: #6C707E; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #ECEDF0; }
      .dotc { fill: #548AF7; }
      .sub  { fill: #9DA0A8; }
    }
  </style>

  <!-- Mark -->
  <g transform="translate(8,12) scale(2.5)">
    <rect x="2" y="2" width="8" height="3" rx="1.5" fill="#3574F0"/>
    <circle cx="12.5" cy="3.5" r="1.5" fill="#4FC3F7"/>
    <rect x="2" y="6.5" width="12" height="3" rx="1.5" fill="#3574F0"/>
    <rect x="2" y="11" width="6" height="3" rx="1.5" fill="#4FC3F7"/>
    <circle cx="10.5" cy="12.5" r="1.5" fill="#3574F0"/>
  </g>

  <!-- Wordmark: "Lanes." — the period is the brand's live status dot -->
  <text x="62" y="38" class="word">Lanes<tspan class="dotc">.</tspan></text>
  <text x="63" y="54" class="sub">RUN · MONITOR · AUTOMATE</text>
</svg>
