plugins {
    id "org.jetbrains.intellij" version "1.16.0"
}

group = 'com.khmelyuk'
version = '1.15.1'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

intellij {
    pluginName = 'multiple_run'
    version = '2023.3'
    // Bundled plugin that provides com.intellij.profiler.DefaultProfilerExecutorGroup
    plugins = ['com.jetbrains.performancePlugin.async']
    updateSinceUntilBuild = false
}

// Load the plugin repo api key from local.properties file
Properties properties = new Properties()
def propertiesFile = project.rootProject.file('local.properties')
if (propertiesFile.exists()) {
    properties.load(propertiesFile.newDataInputStream())
}

publishPlugin {
    def hubToken = properties.getProperty('hub.token')
    if (hubToken != null) {
        token = hubToken
    }
}
