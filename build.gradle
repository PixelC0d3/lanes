plugins {
    id "org.jetbrains.intellij" version "1.16.0"
}

group = 'io.github.welingtonmonteiro'
version = '1.42.2'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

intellij {
    pluginName = 'multiple_run'
    version = '2023.3'
    // Bundled plugin that provides com.intellij.profiler.DefaultProfilerExecutorGroup
    plugins = ['com.jetbrains.performancePlugin.async']
    updateSinceUntilBuild = false
}

// The plugin registers no Settings pages (no applicationConfigurable/projectConfigurable), so
// buildSearchableOptions has nothing to index. It launches a full headless IDE that intermittently
// fails with a platform ConcurrentModificationException during shutdown; disabling it removes a
// useless, flaky build step (buildPlugin no longer depends on a headless IDE run).
buildSearchableOptions {
    enabled = false
}

// Keep a rolling archive of the last built plugin zips in dist/, which lives outside build/ and so
// survives `gradlew clean`. buildPlugin copies its zip here and the oldest are pruned, keeping at
// least the KEEP_LAST_ZIPS most recently built ones.
def pluginArchiveDir = file("$rootDir/dist")
def KEEP_LAST_ZIPS = 5

tasks.register('archivePluginZip') {
    description = "Copy the built plugin zip into dist/ and keep only the last ${KEEP_LAST_ZIPS}."
    doLast {
        pluginArchiveDir.mkdirs()
        // copy every freshly built zip into the archive (overwriting a same-named one)
        fileTree(dir: "$buildDir/distributions", include: '*.zip').files.each { zip ->
            java.nio.file.Files.copy(zip.toPath(),
                    new File(pluginArchiveDir, zip.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        // prune: keep the KEEP_LAST_ZIPS most recently modified zips, delete the rest.
        // NB: sort the List explicitly (Array.sort in place is unreliable here) - newest first.
        def zips = pluginArchiveDir.listFiles({ dir, name -> name.endsWith('.zip') } as FilenameFilter)
        if (zips != null && zips.length > KEEP_LAST_ZIPS) {
            def newestFirst = zips.toList().sort(false) { -it.lastModified() }
            newestFirst.drop(KEEP_LAST_ZIPS).each { it.delete() }
        }
    }
}

tasks.named('buildPlugin').configure {
    finalizedBy('archivePluginZip')
}

// Load the plugin repo api key from local.properties file
Properties properties = new Properties()
def propertiesFile = project.rootProject.file('local.properties')
if (propertiesFile.exists()) {
    properties.load(propertiesFile.newDataInputStream())
}

publishPlugin {
    def hubToken = properties.getProperty('hub.token')
    if (hubToken != null) {
        token = hubToken
    }
}
